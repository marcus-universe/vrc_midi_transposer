[workspace]
members = ["crates/engine", "src-tauri"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
rust-version = "1.90"
authors = ["Marcus Universe <contact@marcus-universe.de>"]
license = "MIT"
repository = "https://github.com/marcus-universe/vrc_midi_transposer"
homepage = "https://github.com/marcus-universe/vrc_midi_transposer"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
